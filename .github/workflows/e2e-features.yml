name: E2E Feature Tests (non-blocking)

# Runs the LLM-backed "Feature:" suites against a self-contained full-stack.
# These hit Groq/Gemini/GitHub live and are inherently non-deterministic, so they
# do NOT gate pushes/PRs — they run on a nightly schedule and on demand only.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # nightly at 06:00 UTC

jobs:
  e2e-features:
    name: Feature E2E (LLM, non-blocking)
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend on :8000
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.AUDITOR_GITHUB_TOKEN }}
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/ > /dev/null; then echo "✅ Backend up"; exit 0; fi
            sleep 2
          done
          echo "❌ Backend failed"; cat backend.log; exit 1

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Start frontend on :3000
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          nohup npm run start > frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login > /dev/null; then echo "✅ Frontend up"; exit 0; fi
            sleep 2
          done
          echo "❌ Frontend failed"; cat frontend.log; exit 1

      # ── Playwright (Feature suites only) ─────────────────────────────────────
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Feature E2E
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_BACKEND_URL: http://localhost:8000
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test --grep "Feature:" --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-features
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload server logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: server-logs-features
          path: |
            backend/backend.log
            frontend/frontend.log
          retention-days: 7
