name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # also run every 6 hours to catch live site issues

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    container:
      # Image version MUST match @playwright/test in e2e/package.json.
      # Current: @playwright/test ^1.44.0 → image v1.44.0-jammy
      # To upgrade: bump both together, e.g. 1.45.0 here and in package.json
      image: mcr.microsoft.com/playwright:v1.44.0-jammy
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Run E2E tests
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          PLAYWRIGHT_BACKEND_URL: ${{ secrets.PLAYWRIGHT_BACKEND_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7